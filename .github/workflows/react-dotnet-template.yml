name: React .NET project and reference
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: '2026.9.5'
      - run: mise trust
      - name: Install dependencies and generate routes
        run: mise run setup
      - name: Install Chromium and platform dependencies
        run: mise run setup:browser
      - name: Verify product project
        run: mise run verify
      - name: Upload failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-dotnet-project-e2e-${{ matrix.os }}
          path: |
            dist/playwright-report-*/
            dist/e2e-results-*/
          if-no-files-found: ignore
          retention-days: 7
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reference
    env:
      CI: 'true'
      E2E_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: '2026.9.5'
      - run: mise trust
      - name: Install dependencies and generate routes
        run: mise run setup
      - name: Install Chromium and platform dependencies
        run: mise run setup:browser
      - name: Typecheck, lint, documents, tests, build and real E2E
        run: mise run verify
      - name: Upload failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-dotnet-e2e-${{ matrix.os }}
          path: |
            reference/dist/playwright-report-*/
            reference/dist/e2e-results-*/
          if-no-files-found: ignore
          retention-days: 7
