name: React .NET project
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
      E2E_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          version: '2026.9.5'
      - run: mise trust
      - name: Install dependencies and generate routes
        run: mise run setup
      - name: Install Chromium and platform dependencies
        run: mise run setup:browser
      - name: Verify product project
        run: mise run verify
      - name: Package verified Linux distribution
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh
      - name: Upload verified Linux distribution
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-analytics-linux-x64
          path: dist/package/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload failed-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: react-dotnet-project-e2e-${{ matrix.os }}
          path: |
            dist/playwright-report-*/
            dist/e2e-results-*/
          if-no-files-found: ignore
          retention-days: 7
